# Copy this file to secret.yaml, fill in real values, and NEVER commit secret.yaml.
# secret.yaml is already listed in .gitignore.
#
# In production, prefer sealed-secrets, External Secrets Operator, or your
# cloud provider's secret manager (AWS Secrets Manager / GCP Secret Manager)
# over raw Kubernetes Secrets checked into version control.
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secrets
  namespace: task-manager
type: Opaque
stringData:
  DATABASE_URL: "postgresql://taskuser:REPLACE_ME@postgres:5432/taskdb"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
